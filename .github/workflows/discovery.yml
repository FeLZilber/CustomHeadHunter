name: discovery

# The repository variable PRODUCTION_ENABLED gates every run, so nothing spends
# minutes or reaches the database until the operator has set the secrets.
#
# GitHub runs schedules on a best-effort basis. It can drop one, and in this
# repository it started them 7 to 10 hours late on every day measured (9 to 11
# November 2026: the 06:17 cron ran between 14:29 and 16:30 UTC). So there are
# four spread through the day: with that lag the two early ones land in the
# Israeli morning and midday, and without it the two late ones do. A run that
# lands at night still delivers, silently (see isQuietHour). The shared
# concurrency group stops runs from overlapping, and an extra pass costs little:
# unchanged boards answer 304, unchanged jobs are never rematched and alerts
# are deduplicated. tests/unit/workflows.test.ts requires at least two.
on:
  schedule:
    - cron: "17 22 * * *"  # about 08:00 in Israel when started 8 hours late
    - cron: "17 3 * * *"   # about 13:00 in Israel when started 8 hours late
    - cron: "17 6 * * *"   # about 09:00 in Israel when started on time
    - cron: "43 11 * * *"  # backup pass
  workflow_dispatch:
    inputs:
      mode:
        description: Crawl mode. Full ignores ETags but never re-runs unchanged matches.
        type: choice
        options: [incremental, full]
        default: incremental
      provider:
        description: Limit the crawl to one ATS
        type: choice
        options: [all, greenhouse, lever, ashby, workable, jsonld, workday]
        default: all
      company:
        description: Limit the crawl to one company
        type: string
        default: ""
      retry-failed:
        description: Reopen AI tasks that exhausted their attempts
        type: boolean
        default: false
      force-rematch:
        description: Rematch every eligible job, within the run's cap
        type: boolean
        default: false
      notify-dry-run:
        description: Report what would be sent without sending
        type: boolean
        default: false
      rematch-digest:
        description: Send one capped digest of older jobs after a relevance change
        type: boolean
        default: false
      retry-ambiguous:
        description: Resend ambiguous deliveries, after checking the chat
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: job-hunter-worker
  cancel-in-progress: false

jobs:
  discover:
    if: ${{ vars.PRODUCTION_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CRAWLER_CONTACT: ${{ vars.CRAWLER_CONTACT || format('{0}/{1}', github.server_url, github.repository) }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CRAWL_TIME_BUDGET_SECONDS: ${{ vars.CRAWL_TIME_BUDGET_SECONDS }}
      AI_MINUTES_PER_MONTH: ${{ vars.AI_MINUTES_PER_MONTH }}
      INFERENCE_TIMEOUT_SECONDS: ${{ vars.INFERENCE_TIMEOUT_SECONDS }}
      MAX_JOB_INPUT_TOKENS: ${{ vars.MAX_JOB_INPUT_TOKENS }}
      MAX_ALERTS_PER_RUN: ${{ vars.MAX_ALERTS_PER_RUN }}
      NOTIFY_TIME_BUDGET_SECONDS: ${{ vars.NOTIFY_TIME_BUDGET_SECONDS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pipeline
        with:
          job-minutes: "60"
          trigger: ${{ github.event_name }}
          mode: ${{ inputs.mode || 'incremental' }}
          provider: ${{ inputs.provider != 'all' && inputs.provider || '' }}
          company: ${{ inputs.company }}
          retry-failed: ${{ inputs.retry-failed || false }}
          force-rematch: ${{ inputs.force-rematch || false }}
          notify-dry-run: ${{ inputs.notify-dry-run || false }}
          rematch-digest: ${{ inputs.rematch-digest || false }}
          retry-ambiguous: ${{ inputs.retry-ambiguous || false }}
          ai-jobs: ${{ vars.MAX_AI_JOBS_PER_RUN || '8' }}
          ai-seconds: ${{ vars.AI_TIME_BUDGET_SECONDS || '900' }}
