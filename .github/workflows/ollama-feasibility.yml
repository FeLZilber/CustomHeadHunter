name: ollama-feasibility

# Runs a cold cache miss then a cache hit on fresh runners. It takes about 36
# runner minutes, so it runs only when the benchmark itself changes.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - benchmarks/ollama/**
      - src/config/budget.ts
      - ollama/model-lock.json
      - .github/actions/ollama-start/**
      - .github/workflows/ollama-feasibility.yml
      - .github/workflows/ollama-benchmark-run.yml

permissions:
  contents: read

concurrency:
  group: ollama-feasibility
  cancel-in-progress: false

jobs:
  cache-miss:
    uses: ./.github/workflows/ollama-benchmark-run.yml
    with:
      phase: cache-miss
      key-suffix: -spike-${{ github.run_id }}-${{ github.run_attempt }}
      passes: 1
  cache-hit:
    needs: cache-miss
    uses: ./.github/workflows/ollama-benchmark-run.yml
    with:
      phase: cache-hit
      key-suffix: -spike-${{ github.run_id }}-${{ github.run_attempt }}
      passes: 1

  # Each run saves its own 1.9 GB model entry. Left behind, a few runs fill the
  # repository's 10 GB cache and evict the entries production uses.
  delete-cache:
    needs: [cache-miss, cache-hit]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SUFFIX: -spike-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - run: |
          gh cache list --key ollama- --limit 100 --json key --jq '.[].key' |
            { grep -- "$SUFFIX\$" || true; } |
            while read -r key; do gh cache delete "$key"; echo "Deleted $key"; done
