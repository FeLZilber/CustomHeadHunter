name: Job pipeline
description: One worker pass shared by discovery, maintenance and the smoke test. Expects a checkout and the worker's environment.

# A failed stage turns the job red, and later stages still run where their work
# is independent of it: a crawl failure must not stop already-matched jobs from
# being delivered.
#
# Every stage has a deadline, but together they can exceed the job's timeout,
# and a timed-out job skips notify. So matching gets only the time left after
# setting aside notify, cleanup and health, and it is skipped when that cannot
# fit one inference. match-budget.sh does the arithmetic.

inputs:
  trigger:
    description: Recorded on run rows.
    required: true
  mode:
    description: incremental or full.
    default: incremental
  provider:
    description: Limit the crawl to one ATS.
    default: ""
  company:
    description: Limit the crawl to one company.
    default: ""
  retry-failed:
    description: Reopen AI tasks that exhausted their attempts.
    default: "false"
  force-rematch:
    description: Rematch every eligible job.
    default: "false"
  notify-dry-run:
    description: Report what would be sent without sending.
    default: "false"
  rematch-digest:
    description: Send one capped digest of older jobs after a relevance change.
    default: "false"
  retry-ambiguous:
    description: Resend deliveries the operator confirmed did not arrive.
    default: "false"
  ai-jobs:
    description: Job cap for this pass.
    required: true
  ai-seconds:
    description: Time budget for matching.
    required: true
  maintenance:
    description: Also remove expired history and fail when discovery is stale.
    default: "false"
  job-minutes:
    description: The calling job's timeout-minutes. tests/unit/workflows.test.ts keeps the two equal.
    required: true

runs:
  using: composite
  steps:
    # Seconds kept free after matching: notify's deadline, cleanup's when
    # maintaining, health's, and 60 s for docker rm, post steps and the
    # steps before this one.
    - id: start
      shell: bash
      env:
        JOB_MINUTES: ${{ inputs.job-minutes }}
        MAINTENANCE: ${{ inputs.maintenance }}
      run: |
        reserve=$(( ${NOTIFY_TIME_BUDGET_SECONDS:-180} + 60 + 60 + 60 ))
        if [[ "$MAINTENANCE" == "true" ]]; then reserve=$(( reserve + 120 )); fi
        echo "match-deadline=$(( $(date +%s) + JOB_MINUTES * 60 - reserve ))" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm

    # Install scripts are skipped because this job's environment holds production credentials.
    - shell: bash
      run: npm ci --ignore-scripts

    - id: prepare
      shell: bash
      run: |
        "$GITHUB_ACTION_PATH/worker.sh" 120 migrate
        "$GITHUB_ACTION_PATH/worker.sh" 60 seed
        "$GITHUB_ACTION_PATH/worker.sh" 120 adopt

    - id: crawl
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
      shell: bash
      env:
        TRIGGER: ${{ inputs.trigger }}
        MODE: ${{ inputs.mode }}
        PROVIDER: ${{ inputs.provider }}
        COMPANY: ${{ inputs.company }}
      run: |
        args=(--trigger "$TRIGGER" --mode "$MODE")
        if [[ -n "$PROVIDER" ]]; then args+=(--provider "$PROVIDER"); fi
        if [[ -n "$COMPANY" ]]; then args+=(--company "$COMPANY"); fi
        "$GITHUB_ACTION_PATH/worker.sh" $(( ${CRAWL_TIME_BUDGET_SECONDS:-600} + 120 )) crawl "${args[@]}"

    - id: queue
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
      shell: bash
      env:
        RETRY_FAILED: ${{ inputs.retry-failed }}
        FORCE_REMATCH: ${{ inputs.force-rematch }}
      run: |
        # A filter release or a large new source re-evaluates every job. It took more than 120 s for
        # about 1,400 jobs against the hosted database (2026-11-12). Batches commit as they go.
        "$GITHUB_ACTION_PATH/worker.sh" 600 evaluate
        args=()
        if [[ "$RETRY_FAILED" == "true" ]]; then args+=(--retry-failed); fi
        if [[ "$FORCE_REMATCH" == "true" ]]; then args+=(--force-rematch); fi
        if (( ${#args[@]} )); then "$GITHUB_ACTION_PATH/worker.sh" 60 requeue "${args[@]}"; fi
        "$GITHUB_ACTION_PATH/worker.sh" 60 pending

    # The model costs minutes to load, so it starts only when there is work and
    # time for at least one inference after a typical start (1.1 to 1.7 min measured).
    - id: budget
      if: ${{ !cancelled() && steps.queue.outcome == 'success' && steps.queue.outputs.pending != '0' && inputs.ai-jobs != '0' }}
      shell: bash
      env:
        MATCH_DEADLINE: ${{ steps.start.outputs.match-deadline }}
        AI_SECONDS: ${{ inputs.ai-seconds }}
      run: |
        plan=$("$GITHUB_ACTION_PATH/match-budget.sh" "$MATCH_DEADLINE" "$AI_SECONDS" 180)
        read -r budget _ <<< "$plan"
        if (( budget == 0 )); then
          echo "::warning::Too little job time left for one inference before notify; the model is skipped this run."
          echo "start=false" >> "$GITHUB_OUTPUT"
        else
          echo "start=true" >> "$GITHUB_OUTPUT"
        fi

    - id: ollama
      if: ${{ !cancelled() && steps.budget.outputs.start == 'true' }}
      uses: ./.github/actions/ollama-start

    - id: match
      if: ${{ !cancelled() && steps.ollama.outcome == 'success' }}
      shell: bash
      env:
        TRIGGER: ${{ inputs.trigger }}
        MAX_AI_JOBS_PER_RUN: ${{ inputs.ai-jobs }}
        MATCH_DEADLINE: ${{ steps.start.outputs.match-deadline }}
        AI_SECONDS: ${{ inputs.ai-seconds }}
      run: |
        plan=$("$GITHUB_ACTION_PATH/match-budget.sh" "$MATCH_DEADLINE" "$AI_SECONDS" 0)
        read -r budget stage <<< "$plan"
        if (( budget == 0 )); then
          echo "::warning::Ollama took too long to leave time for one inference before notify; matching is skipped this run."
          exit 0
        fi
        if (( budget < AI_SECONDS )); then echo "::notice::AI time budget trimmed from ${AI_SECONDS}s to ${budget}s to fit the job's timeout."; fi
        AI_TIME_BUDGET_SECONDS=$budget "$GITHUB_ACTION_PATH/worker.sh" "$stage" match --trigger "$TRIGGER"

    - if: ${{ always() && steps.ollama.outcome != 'skipped' }}
      shell: bash
      run: docker rm -f ollama

    - id: notify
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
      shell: bash
      env:
        TRIGGER: ${{ inputs.trigger }}
        NOTIFY_DRY_RUN: ${{ inputs.notify-dry-run }}
        REMATCH_DIGEST: ${{ inputs.rematch-digest }}
        RETRY_AMBIGUOUS: ${{ inputs.retry-ambiguous }}
      run: |
        args=(--trigger "$TRIGGER")
        if [[ "$NOTIFY_DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
        if [[ "$REMATCH_DIGEST" == "true" ]]; then args+=(--rematch-digest); fi
        if [[ "$RETRY_AMBIGUOUS" == "true" ]]; then args+=(--retry-ambiguous); fi
        "$GITHUB_ACTION_PATH/worker.sh" $(( ${NOTIFY_TIME_BUDGET_SECONDS:-180} + 60 )) notify "${args[@]}"

    - if: ${{ !cancelled() && steps.prepare.outcome == 'success' && inputs.maintenance == 'true' }}
      shell: bash
      run: |
        "$GITHUB_ACTION_PATH/worker.sh" 120 cleanup

    - if: ${{ always() && steps.prepare.outcome == 'success' }}
      shell: bash
      env:
        MAINTENANCE: ${{ inputs.maintenance }}
      run: |
        args=()
        if [[ "$MAINTENANCE" == "true" ]]; then args+=(--fail-on-stale --alert); fi
        "$GITHUB_ACTION_PATH/worker.sh" 60 health "${args[@]}"
